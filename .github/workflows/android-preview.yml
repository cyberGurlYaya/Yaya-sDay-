name: Yaya'sDay Android Preview

on:
  workflow_dispatch:
  push:
    branches:
      - v1-complete-build

jobs:
  build-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-v1]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest --no-audit --no-fund

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Build Android preview with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait
